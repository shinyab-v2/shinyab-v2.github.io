<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차트 분석 공부 · 2026.09.07–09.13</title><style>body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7f9;color:#111827}header{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 5%;display:flex;justify-content:space-between}main{max-width:980px;margin:auto;padding:28px 18px 60px}a{color:inherit}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tabs button{border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap;cursor:pointer}.tabs button.on{background:#111827;color:#fff}section,.chart{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:14px 0}.note{font-size:13px;color:#6b7280}.risk{background:#fff7ed;border-left:4px solid #f59e0b;padding:12px 14px;margin-top:12px}.quiz{border-top:1px solid #e5e7eb;padding:10px 0}svg{width:100%;height:auto;background:#fcfcfd;border-radius:12px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:#4b5563;margin-top:8px}.pill{display:inline-block;border-radius:999px;background:#eef2ff;padding:5px 9px;margin-right:5px}h1{font-size:30px;line-height:1.25}h2{font-size:21px}</style></head><body><header><strong>차트 분석 공부</strong><a href="../">학습 허브</a></header><main><p class="note">WEEKLY TECHNICAL STUDY · 2026.09.07–09.13</p><h1>추세를 먼저 보고, 지표는 확인 도구로 사용하기</h1><p>매일 하나의 기술적 분석 주제를 실제 차트와 유사한 예시 캔들로 학습합니다. 예시 가격은 개념 설명용 합성 데이터이며 실제 종목 데이터가 아닙니다.</p><div id="tabs" class="tabs"></div><div id="lesson"></div></main><script>
const D=[
{d:'2026-09-07',t:'추세 구조 + 이동평균선',h:'HH·HL / LH·LL로 추세를 읽고 MA20·MA60으로 확인하기',g:'캔들 한두 개의 색보다 고점·저점 구조를 먼저 보고 이동평균선은 추세 확인 도구로 사용합니다.',k:['상승 추세는 Higher High(HH)와 Higher Low(HL)가 반복되는 구조가 기본이다. 하락 추세는 Lower High(LH), Lower Low(LL)다.','MA20이 MA60 위에 있고 두 선의 기울기가 함께 상승하면 중단기 추세가 정렬된 상태로 해석할 수 있지만, 정렬만으로 매수 신호가 완성되는 것은 아니다.','가격이 MA20 아래로 잠시 내려와도 직전 HL과 MA60을 지키면 단순 조정일 수 있다. 반대로 직전 HL 이탈 후 반등이 LH에 막히면 추세 훼손 가능성이 커진다.'],c:['최근 의미 있는 swing high/low를 표시한다.','MA20·MA60의 순서보다 기울기와 가격 위치를 함께 본다.','직전 HL 또는 LH가 깨졌는지 확인한다.','거래량이 추세 방향 움직임에서 확장되는지 확인한다.'],u:['상승 추세에서 HL 부근 조정 후 반전 캔들·거래량 회복이 함께 나오면 진입 후보로 본다.','추세 훼손 시 추가매수를 자동으로 하지 않고 다음 지지선과 손절 기준을 재평가한다.'],m:['MA 골든크로스만 보고 이미 크게 오른 구간을 추격한다.','작은 캔들 한 개의 이탈을 추세 전환으로 과대해석한다.'],q:[['상승 추세의 기본 구조는?','HH와 HL'],['MA보다 먼저 볼 것은?','가격의 고점·저점 구조'],['HL 이탈 후 반등이 LH에 막히면?','상승 추세 훼손 가능성이 커짐']],r:[['Fidelity Technical Analysis','https://www.fidelity.com/learning-center/trading-investing/technical-analysis/technical-analysis-learning-path'],['Fidelity Moving Average','https://www.fidelity.com/learning-center/trading-investing/technical-analysis/technical-indicator-guide/sma']]},
{d:'2026-09-08',t:'지지·저항',h:'선 하나가 아니라 Zone으로 보고 Role Reversal 확인하기',g:'정확한 한 가격보다 반복적으로 매수·매도 반응이 발생한 영역을 지지·저항 Zone으로 읽습니다.',k:['지지·저항은 시장 참여자의 주문과 기억이 누적된 영역이므로 한 점이 아니라 일정 폭의 zone으로 보는 편이 현실적이다.','이전 저항을 강하게 돌파한 뒤 되돌림에서 그 영역이 지지로 작동하면 role reversal이 확인된다.','반복해서 테스트된 지지는 중요할 수 있지만 테스트 횟수가 늘면서 주문이 소진될 가능성도 함께 본다.'],c:['최근 거래량을 동반한 swing high/low가 모인 가격대','갭 시작·종료 구간과 대량거래 캔들의 몸통 영역','돌파 후 되돌림에서 이전 저항 위 종가 유지 여부','지지선에서 반등 폭이 점차 작아지는지'],u:['돌파 직후 추격보다 첫 retest에서 가격이 zone을 지키는지 확인한다.','지지 이탈 후 즉시 회복하지 못하면 손절·축소 기준을 실행한다.'],m:['차트에 너무 많은 수평선을 그어 모든 가격을 지지·저항으로 만든다.','장중 꼬리 한 번의 이탈만으로 확정 돌파로 판단한다.'],q:[['지지·저항을 zone으로 보는 이유는?','실제 주문 반응이 한 가격에만 모이지 않기 때문'],['이전 저항이 돌파 후 지지가 되는 현상은?','role reversal'],['돌파 확인에 중요한 것은?','종가·거래량·retest의 지속성']],r:[['Fidelity Support & Resistance','https://www.fidelity.com/learning-center/trading-investing/technical-analysis/support-and-resistance'],['CMT Association','https://cmtassociation.org/']]},
{d:'2026-09-09',t:'거래량 확인',h:'가격 움직임을 거래량으로 확인하기 — Relative Volume과 실패 신호',g:'가격 방향과 거래량 변화가 서로 확인해 주는지 살펴 돌파의 질과 매도 압력을 평가합니다.',k:['거래량은 가격 움직임에 참여한 거래의 크기를 보여주는 확인 지표다. 상승 돌파가 평소보다 높은 거래량과 함께 나오면 참여 확대로 해석할 근거가 늘어난다.','단순 절대 거래량보다 최근 평균 대비 비율(relative volume)을 보면 종목별 규모 차이를 줄여 비교하기 쉽다.','하락일 대량 거래량이 반복되며 종가가 저가 부근에 형성되면 공급 압력이 강하다고 볼 수 있다. 반대로 capitulation 이후 강한 회복은 별도로 구분해야 한다.'],c:['20일 평균 거래량 대비 당일 거래량','돌파 캔들의 종가 위치와 몸통 크기','상승일·하락일 거래량의 비대칭','가격은 신고가인데 거래량이 지속 감소하는지'],u:['저항 돌파 시 가격뿐 아니라 거래량 확대를 조건에 추가한다.','급락 대량거래 후 다음 날 회복 강도로 투매 종료 여부를 확인한다.'],m:['거래량이 많다는 이유만으로 무조건 매수 신호로 해석한다.','장중 누적 거래량을 종가 기준 평균과 그대로 비교한다.'],q:[['relative volume이 2라면?','기준 평균의 약 2배'],['돌파 시 거래량을 보는 이유는?','참여 강도 확인'],['대량 하락 거래량이 반복되면?','공급 압력을 의심']],r:[['Fidelity Volume','https://www.fidelity.com/learning-center/trading-investing/technical-analysis/technical-indicator-guide/volume'],['Fidelity OBV','https://www.fidelity.com/learning-center/trading-investing/technical-analysis/technical-indicator-guide/obv']]},
{d:'2026-09-10',t:'RSI',h:'RSI 70/30만 보지 말고 Regime과 Divergence로 읽기',g:'RSI를 단순 과매수·과매도 버튼이 아니라 추세 강도와 모멘텀 변화 관찰 도구로 사용합니다.',k:['RSI는 최근 상승·하락 움직임의 상대적 강도를 0~100 범위로 표현하는 momentum oscillator다.','강한 상승 추세에서는 RSI가 40~80 부근의 높은 regime을 오래 유지할 수 있어 70을 넘었다고 바로 매도하면 추세를 너무 일찍 떠날 수 있다.','가격은 higher high인데 RSI가 lower high를 만들면 bearish divergence다. 다만 divergence는 단독 반전 신호가 아니라 추세 약화 경고로 취급한다.'],c:['RSI가 50 위/아래에서 얼마나 오래 머무는지','상승 추세 조정에서 RSI가 40~50 부근을 지지하는지','가격 swing과 RSI swing의 방향 차이','divergence 뒤 실제 가격 구조 이탈이 발생하는지'],u:['상승 추세에서 RSI 40~50 지지 + 가격 HL 유지가 겹치면 조정 종료 후보로 본다.','RSI bearish divergence가 있어도 가격 HL 이탈 전까지는 추세 전환을 확정하지 않는다.'],m:['RSI 70=매도, 30=매수라는 고정 규칙만 사용한다.','가격 swing과 맞지 않는 임의 지점을 연결해 divergence를 만든다.'],q:[['강한 상승 추세에서 RSI 70은 무조건 매도인가?','아니다'],['가격 HH, RSI LH는?','bearish divergence'],['divergence 뒤 추가로 볼 것은?','가격 구조 확인']],r:[['Fidelity RSI','https://www.fidelity.com/learning-center/trading-investing/technical-analysis/technical-indicator-guide/RSI'],['J. Welles Wilder RSI overview','https://www.fidelity.com/learning-center/trading-investing/technical-analysis/technical-indicator-guide/RSI']]},
{d:'2026-09-11',t:'MACD',h:'MACD Line·Signal·Histogram으로 모멘텀 가속과 둔화를 구분하기',g:'단순 crossover보다 0선 위치와 histogram의 확대·축소를 함께 봅니다.',k:['MACD는 보통 빠른 EMA와 느린 EMA의 차이로 momentum과 trend를 함께 본다. Signal line은 MACD의 평균이며 histogram은 두 선의 차이다.','MACD가 0선 위에서 유지되면 빠른 평균이 느린 평균보다 높은 상태다. 상승 추세 속 조정에서 0선 근처 재상승은 추세 지속 후보로 볼 수 있다.','가격이 상승하는데 histogram peak가 낮아지면 상승 momentum 둔화를 시사할 수 있지만 가격 구조가 유지되면 즉시 매도 신호는 아니다.'],c:['MACD의 0선 위/아래 위치','MACD–Signal crossover가 어디에서 발생했는지','histogram이 0선으로 수렴하는 속도','가격 고점과 MACD 고점의 divergence'],u:['추세 방향과 동일한 MACD 재가속을 진입 확인 요소로 사용한다.','고점권에서 가격 상승은 이어지는데 histogram이 빠르게 축소되면 익절·trailing 기준을 강화한다.'],m:['모든 crossover를 독립 매매 신호로 쓴다.','횡보장에서 잦은 whipsaw를 무시한다.'],q:[['MACD histogram은 무엇의 차이인가?','MACD line과 Signal line'],['0선 위 MACD는 일반적으로?','빠른 EMA가 느린 EMA보다 높음'],['횡보장에서 주의할 것은?','잦은 false crossover']],r:[['Fidelity MACD','https://www.fidelity.com/learning-center/trading-investing/technical-analysis/technical-indicator-guide/macd'],['Fidelity EMA','https://www.fidelity.com/learning-center/trading-investing/technical-analysis/technical-indicator-guide/ema']]},
{d:'2026-09-12',t:'돌파·리테스트',h:'Breakout을 추격하지 않고 Retest와 False Break를 구분하기',g:'저항 돌파 뒤 종가·거래량·되돌림을 함께 확인해 진짜 돌파와 실패 돌파를 구분합니다.',k:['breakout은 중요한 저항 zone을 넘어 가격이 새로운 범위로 이동하려는 시도다. intraday spike보다 종가가 zone 위에서 유지되는지가 중요하다.','좋은 retest는 이전 저항 부근까지 되돌린 뒤 매도 압력을 흡수하고 다시 고점을 향한다.','돌파 직후 zone 아래로 빠르게 복귀하고 반등이 이전 저항에 막히면 failed breakout 가능성이 커진다.'],c:['돌파 캔들의 종가가 저항 zone 위에 있는지','거래량이 최근 평균보다 증가했는지','retest에서 저점이 zone 위 또는 근처에서 형성되는지','실패 시 얼마나 빠르게 range 안으로 되돌아오는지'],u:['초기 돌파에 소량, retest 확인 후 추가하는 식으로 진입을 나눌 수 있다.','failed breakout이면 손절을 지연시키지 않고 기존 range 복귀를 thesis 훼손으로 본다.'],m:['긴 윗꼬리만 남긴 intraday 돌파를 확정 돌파로 본다.','retest가 너무 깊어 구조가 깨졌는데도 정상 눌림으로 합리화한다.'],q:[['돌파 확인에서 종가가 중요한 이유는?','장중 spike보다 지속성을 보기 위해'],['좋은 retest는?','이전 저항이 지지로 작동'],['range 안으로 빠른 복귀는?','failed breakout 경고']],r:[['Fidelity Breakouts','https://www.fidelity.com/learning-center/trading-investing/technical-analysis/technical-analysis-learning-path'],['Fidelity Support & Resistance','https://www.fidelity.com/learning-center/trading-investing/technical-analysis/support-and-resistance']]},
{d:'2026-09-13',t:'멀티 타임프레임',h:'주봉→일봉→60분봉으로 방향·Setup·Trigger를 분리하기',g:'큰 시간대에서 방향을 정하고 작은 시간대는 진입 시점과 위험 관리를 정교하게 만드는 데 사용합니다.',k:['상위 time frame은 큰 추세와 핵심 지지·저항을 정의하는 데 쓰고, 하위 time frame은 구체적 setup과 trigger를 찾는 데 쓴다.','예를 들어 주봉은 장기 방향, 일봉은 swing setup, 60분봉은 entry trigger와 손절 위치를 세밀하게 잡는 식으로 역할을 분리한다.','하위 time frame의 강한 반등이 상위 time frame의 하락 추세 저항 바로 아래에서 발생하면 신뢰도를 낮춰야 한다.'],c:['주봉의 주요 HH/HL 또는 LH/LL','일봉의 MA와 핵심 support/resistance','60분봉에서 breakout/retest 또는 반전 구조','각 시간대의 신호가 서로 충돌하는지'],u:['상위 추세가 상승일 때 일봉 조정, 60분봉 추세 회복을 단계적으로 확인한다.','상위 추세가 훼손됐다면 60분봉 반등만으로 대규모 추가매수를 하지 않는다.'],m:['1분·5분·60분·일봉을 동시에 보며 서로 다른 신호에 과잉 반응한다.','원하는 결론이 나올 때까지 time frame을 바꾼다.'],q:[['상위 time frame의 주요 역할은?','큰 방향과 핵심 레벨 정의'],['하위 time frame의 역할은?','진입 trigger와 위험 관리 정교화'],['시간대가 충돌하면?','상위 구조를 우선하고 포지션을 보수적으로 판단']],r:[['Fidelity Technical Analysis','https://www.fidelity.com/learning-center/trading-investing/technical-analysis/technical-analysis-learning-path'],['Fidelity EMA','https://www.fidelity.com/learning-center/trading-investing/technical-analysis/technical-indicator-guide/ema']]}
];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let date=new URLSearchParams(location.search).get('date')||D[0].d;const tabs=document.querySelector('#tabs');D.forEach(x=>{let b=document.createElement('button');b.textContent=x.d.slice(5);b.onclick=()=>{date=x.d;history.replaceState(null,'','?date='+date);render()};tabs.append(b)});const list=a=>'<ul>'+a.map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul>';function svg(seed){let y=Array.from({length:34},(_,i)=>100+i*.65+Math.sin((i+seed)*.8)*2.4+(i>20?Math.sin(i*.35)*1.3:0)),w=860,h=330,min=Math.min(...y)-4,max=Math.max(...y)+4,Y=z=>22+(max-z)/(max-min)*240;let ma=n=>y.map((_,i)=>{let a=y.slice(Math.max(0,i-n+1),i+1);return a.reduce((p,c)=>p+c,0)/a.length});let path=a=>a.map((v,i)=>`${i?'L':'M'}${28+i*800/(a.length-1)},${Y(v)}`).join(' ');let candles=y.map((v,i)=>{let x=28+i*800/(y.length-1),o=v+Math.sin(i*1.7)*1.2,hi=Math.max(o,v)+.8,lo=Math.min(o,v)-.8;return `<line x1="${x}" x2="${x}" y1="${Y(hi)}" y2="${Y(lo)}" stroke="#64748b"/><rect x="${x-4}" y="${Math.min(Y(o),Y(v))}" width="8" height="${Math.max(2,Math.abs(Y(o)-Y(v)))}" fill="${v>=o?'#111827':'#9ca3af'}"/>`}).join('');return `<svg viewBox="0 0 ${w} ${h}" role="img"><line x1="28" y1="280" x2="828" y2="280" stroke="#d1d5db"/>${candles}<path d="${path(ma(6))}" fill="none" stroke="#475569" stroke-width="2"/><path d="${path(ma(14))}" fill="none" stroke="#94a3b8" stroke-width="2"/><text x="30" y="310" font-size="13" fill="#6b7280">개념 학습용 합성 캔들 · 실제 종목 데이터 아님</text></svg>`}function render(){let x=D.find(v=>v.d===date)||D[0];[...tabs.children].forEach((b,i)=>b.classList.toggle('on',D[i].d===x.d));document.querySelector('#lesson').innerHTML=`<section><span class="pill">${x.d}</span><span class="pill">${esc(x.t)}</span><h2>${esc(x.h)}</h2><p>${esc(x.g)}</p></section><div class="chart">${svg(D.indexOf(x)+1)}<div class="legend">캔들 · 단기 이동평균 · 중기 이동평균</div></div><section><h2>1. 핵심 개념</h2>${list(x.k)}</section><section><h2>2. 차트에서 확인할 포인트</h2>${list(x.c)}</section><section><h2>3. 실제 매매 활용</h2>${list(x.u)}<div class="risk"><strong>주의:</strong> 기술적 분석은 확률적 도구입니다. 가격 구조, 거래량, 위험 한도를 함께 확인하고 단일 지표만으로 매매하지 않습니다.</div></section><section><h2>4. 흔한 실수</h2>${list(x.m)}</section><section><h2>5. 복습 퀴즈</h2>${x.q.map((q,i)=>`<details class="quiz"><summary>Q${i+1}. ${esc(q[0])}</summary><p><strong>정답:</strong> ${esc(q[1])}</p></details>`).join('')}</section><section><h2>6. 참고 자료</h2><ul>${x.r.map(r=>`<li><a href="${r[1]}" target="_blank" rel="noopener">${esc(r[0])} ↗</a></li>`).join('')}</ul></section>`}render();
</script></body></html>
