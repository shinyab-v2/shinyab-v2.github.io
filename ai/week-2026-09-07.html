<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 전문 개발 학습 · 2026.09.07–09.13</title><link rel="stylesheet" href="ai.css"><style>.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0 24px}.tabs button{border:1px solid #d8dee9;background:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap;cursor:pointer}.tabs button.on{background:#111827;color:#fff}.box{background:#f4f7fb;border-radius:14px;padding:14px 16px}.quiz{border:1px solid #e5e7eb;border-radius:12px;padding:10px 14px;margin:8px 0}pre{white-space:pre-wrap;overflow:auto}</style></head><body><header class="topbar"><a class="brand" href="./"><span class="brand-mark">AI</span><span>AI 전문 개발 학습</span></a><a class="back" href="../">학습 허브</a></header><main class="lesson-layout"><article class="lesson-main"><p class="eyebrow">WEEKLY AI ENGINEERING · 2026.09.07–09.13</p><h1 class="lesson-title">모델을 쓰는 단계에서 구조를 수정하는 단계로</h1><p class="lesson-summary">매일 30–40분 기준. Conv2d 수치 해부 → receptive field → normalization → residual block → efficient convolution → U-Net shape → runtime instrumentation 순서로 진행합니다.</p><div id="tabs" class="tabs"></div><div id="lesson"></div></article></main><script>
const D=[
{d:'2026-09-07',n:5,t:'Conv2d를 숫자로 해부하기 — channel, weight, output shape, groups',s:'Conv2d의 weight [Cout, Cin/groups, Kh, Kw]를 Tensor 축 단위로 읽고 출력 크기·parameter 수를 직접 계산합니다.',g:['입력 [N,C,H,W]에서 출력 shape를 손으로 계산한다.','weight의 네 축 의미를 설명한다.','groups와 depthwise의 연결 구조를 구분한다.','parameter 수와 MACs의 변화를 계산한다.'],k:['일반 convolution에서 하나의 출력 channel은 모든 입력 channel과 연결된다. groups=1이면 weight의 두 번째 축은 Cin이다.','Conv2d(1,32,3)의 weight [32,1,3,3]은 출력 필터 32개 × 입력 channel 1개 × 공간 kernel 3×3을 뜻한다.','출력 크기는 floor((Hin+2P-D(K-1)-1)/S+1). stride는 샘플링 간격, padding은 경계 확장, dilation은 kernel tap 간격을 바꾼다.','groups=g이면 입력·출력 channel 연결을 g개 그룹으로 나눠 weight의 입력 channel 축이 Cin/g가 된다.'],c:`import torch, torch.nn as nn
x=torch.randn(2,1,256,256)
conv=nn.Conv2d(1,32,3,padding=1,bias=False)
y=conv(x)
print(x.shape, conv.weight.shape, y.shape)
print('params=',conv.weight.numel())
# [2,1,256,256] [32,1,3,3] [2,32,256,256]`,p:['Conv2d(3,64,3,stride=2,padding=1)의 [4,3,224,224] 출력 shape와 parameter 수를 계산한다.','groups=4인 Conv2d(32,64,3)의 weight shape를 계산한다.','자신의 모델 첫 10개 Conv2d에 forward hook을 붙여 input/output/weight shape를 기록한다.'],q:[['[32,1,3,3]의 첫 32는?','out_channels'],['3×3 dilation=2의 effective kernel은?','5×5'],['groups=Cin인 대표 구조는?','depthwise convolution']],r:[['PyTorch Conv2d','https://docs.pytorch.org/docs/stable/generated/torch.nn.Conv2d.html'],['PyTorch Module hooks','https://docs.pytorch.org/docs/stable/generated/torch.nn.Module.html']]},
{d:'2026-09-08',n:6,t:'Receptive Field — stride, padding, dilation이 보는 범위를 바꾸는 법',s:'feature-map 크기와 receptive field를 구분하고 layer를 지날 때 r(receptive field)와 j(jump)를 누적 계산합니다.',g:['receptive field와 resolution을 구분한다.','r_new=r+(k_eff-1)j, j_new=j·stride를 적용한다.','dilation의 효과와 gridding 위험을 설명한다.','작은 병변과 넓은 문맥 사이 trade-off를 설계한다.'],k:['시작값을 r=1, j=1로 두고, k_eff=1+(k-1)d를 계산한다.','stride=1의 3×3 두 층은 이론적 receptive field를 3→5로 늘린다.','dilation=2의 3×3은 parameter 수는 3×3 그대로지만 5×5 범위의 위치를 샘플링한다.','early stride=2를 반복하면 문맥은 빨리 넓어지지만 작은 구조의 위치 정보가 손실될 수 있다.'],c:`def rf(r,j,k,s=1,d=1):
    ke=1+(k-1)*d
    return r+(ke-1)*j, j*s
r,j=1,1
for k,s,d in [(3,1,1),(3,2,1),(3,1,2)]:
    r,j=rf(r,j,k,s,d); print(r,j)`,p:['자신의 encoder 각 stage의 r,j 표를 만든다.','dilation=1,2,4 feature map을 같은 입력으로 비교한다.','작은 병변 detection에서 어느 stage부터 dilation을 넣을지 근거와 함께 설계한다.'],q:[['jump j는 무엇인가?','인접 feature 중심의 입력 좌표 간격'],['3×3 dilation=3의 effective kernel은?','7×7'],['stride=2는 j를 어떻게 바꾸나?','2배']],r:[['PyTorch Conv2d','https://docs.pytorch.org/docs/stable/generated/torch.nn.Conv2d.html']]},
{d:'2026-09-09',n:7,t:'Normalization 선택법 — BatchNorm, GroupNorm, LayerNorm',s:'통계를 계산하는 축과 train/eval 동작을 Tensor 관점에서 비교하고 작은 batch에서의 설계 판단을 연습합니다.',g:['BatchNorm2d의 channel별 통계를 설명한다.','GroupNorm이 batch size에 직접 의존하지 않는 이유를 설명한다.','LayerNorm의 normalized_shape를 읽는다.','BN→GN 교체 시 checkpoint와 학습 안정성 이슈를 점검한다.'],k:['BatchNorm2d는 train에서 mini-batch 통계를 사용하고 기본 설정에서는 running mean/variance를 누적해 eval에서 사용한다.','GroupNorm은 sample 내부에서 channel을 그룹으로 나눠 통계를 계산하므로 batch size가 작아도 다른 sample 수에 직접 의존하지 않는다.','LayerNorm은 지정한 마지막 축들에 대해 sample별 정규화한다. Transformer의 embedding 축과 CNN NCHW를 같은 방식으로 생각하면 shape 오류가 날 수 있다.','고해상도 의료영상처럼 batch가 1~4로 제한될 때 GN을 후보로 비교할 수 있지만 실제 성능은 데이터와 pretraining 조건에서 검증해야 한다.'],c:`import torch, torch.nn as nn
x=torch.randn(2,32,64,64)
bn=nn.BatchNorm2d(32)
gn=nn.GroupNorm(8,32)
print(bn(x).shape, gn(x).shape)
bn.train()
for _ in range(5): bn(torch.randn(2,32,64,64)+2)
print(bn.running_mean[:4])`,p:['batch 2와 batch 16에서 BN activation 통계를 비교한다.','BN 모델을 GN으로 치환하고 state_dict strict load 실패 항목을 정리한다.','초음파 학습에서 BN freeze, GN 교체, gradient accumulation 세 전략을 비교 설계한다.'],q:[['BN eval에서 주로 쓰는 통계는?','running statistics'],['GN의 장점은?','batch size에 직접 의존하지 않음'],['LayerNorm에서 가장 먼저 볼 인자는?','normalized_shape']],r:[['PyTorch BatchNorm2d','https://docs.pytorch.org/docs/stable/generated/torch.nn.BatchNorm2d.html'],['PyTorch GroupNorm','https://docs.pytorch.org/docs/stable/generated/torch.nn.GroupNorm.html'],['PyTorch LayerNorm','https://docs.pytorch.org/docs/stable/generated/torch.nn.LayerNorm.html']]},
{d:'2026-09-10',n:8,t:'Residual Block을 직접 수정하기 — projection shortcut과 shape contract',s:'main path와 identity path가 더해질 수 있는 shape 조건을 확인하고 stride/channel 변화 시 projection을 설계합니다.',g:['residual addition의 shape contract를 설명한다.','stride/channel 변화에 projection shortcut이 필요한 이유를 설명한다.','post-activation과 pre-activation 차이를 구조적으로 읽는다.','블록 변경 후 gradient와 출력 shape를 검증한다.'],k:['residual addition은 의도하지 않은 broadcasting이 아니라 N,C,H,W가 명확히 맞아야 안전하다.','main path에서 stride=2 또는 channel 증가가 있으면 identity에도 보통 1×1 convolution과 동일 stride를 적용해 shape를 맞춘다.','skip path가 gradient의 직접 경로를 제공하지만 이것이 모든 최적화 문제를 자동으로 해결한다는 뜻은 아니다.','블록을 수정할 때 출력 shape, parameter 수, activation 분포, gradient norm을 함께 비교해야 한다.'],c:`import torch, torch.nn as nn
class Block(nn.Module):
 def __init__(self,cin,cout,stride=1):
  super().__init__()
  self.main=nn.Sequential(nn.Conv2d(cin,cout,3,stride,1,bias=False),nn.BatchNorm2d(cout),nn.ReLU(),nn.Conv2d(cout,cout,3,1,1,bias=False),nn.BatchNorm2d(cout))
  self.skip=nn.Identity() if cin==cout and stride==1 else nn.Sequential(nn.Conv2d(cin,cout,1,stride,bias=False),nn.BatchNorm2d(cout))
  self.act=nn.ReLU()
 def forward(self,x): return self.act(self.main(x)+self.skip(x))`,p:['Block(32,64,2)에 [2,32,64,64]를 넣고 main/skip shape를 hook으로 기록한다.','projection을 제거해 의도적 shape error를 만든 뒤 오류 원인을 설명한다.','ReLU 위치를 바꿔 pre-activation 변형을 만들고 gradient norm을 비교한다.'],q:[['projection shortcut이 필요한 대표 조건은?','stride 또는 channel 수 변화'],['residual addition 전 확인할 것은?','두 경로 shape'],['1×1 projection의 역할은?','channel·resolution 정렬']],r:[['TorchVision ResNet','https://github.com/pytorch/vision/blob/main/torchvision/models/resnet.py'],['Deep Residual Learning','https://arxiv.org/abs/1512.03385']]},
{d:'2026-09-11',n:9,t:'Grouped·Depthwise·Pointwise Convolution — 효율화를 실제 latency로 검증하기',s:'parameter/FLOPs 감소와 실제 하드웨어 latency가 항상 같은 방향으로 움직이지 않는 이유를 profiler로 확인합니다.',g:['grouped/depthwise/pointwise 연결 구조를 구분한다.','standard와 depthwise-separable parameter 수를 계산한다.','1×1 convolution의 channel mixing 역할을 설명한다.','실제 target device에서 latency를 측정한다.'],k:['depthwise는 groups=Cin으로 각 입력 channel을 독립 처리하고 pointwise 1×1이 channel 정보를 섞는다.','standard 3×3의 비용은 대략 H·W·Cin·Cout·9에 비례하지만 depthwise+pointwise는 H·W·Cin·9 + H·W·Cin·Cout에 가깝다.','FLOPs가 줄어도 memory access, kernel launch, backend 최적화 때문에 실제 latency 감소폭은 다를 수 있다.','모바일/엣지 배포라면 theoretical efficiency뿐 아니라 실제 장치 benchmark가 필수다.'],c:`import torch.nn as nn
std=nn.Conv2d(64,128,3,padding=1,bias=False)
dw=nn.Conv2d(64,64,3,padding=1,groups=64,bias=False)
pw=nn.Conv2d(64,128,1,bias=False)
print(std.weight.numel())
print(dw.weight.numel()+pw.weight.numel())`,p:['standard와 separable block의 parameter 수를 계산한다.','torch.profiler로 동일 input에서 CPU/GPU time을 비교한다.','TensorRT 변환 후 latency 순위가 유지되는지 확인한다.'],q:[['depthwise의 groups 값은 보통?','Cin'],['pointwise kernel은?','1×1'],['FLOPs와 latency가 다른 이유는?','memory/backend 실행 비용']],r:[['PyTorch Conv2d','https://docs.pytorch.org/docs/stable/generated/torch.nn.Conv2d.html'],['PyTorch profiler','https://docs.pytorch.org/tutorials/recipes/recipes/profiler_recipe.html']]},
{d:'2026-09-12',n:10,t:'U-Net을 shape 관점에서 해부하기 — encoder, decoder, skip alignment',s:'encoder–decoder와 skip concat의 Tensor shape를 추적하고 홀수 크기 입력에서 생기는 1-pixel mismatch를 안전하게 처리합니다.',g:['encoder/decoder 역할을 resolution·channel 관점에서 설명한다.','skip concat 후 channel 수를 계산한다.','bilinear upsampling과 ConvTranspose2d를 비교한다.','홀수 H,W mismatch를 재현하고 수정한다.'],k:['encoder는 spatial resolution을 낮추며 문맥을 넓히고 decoder는 resolution을 복원한다.','skip concat은 encoder의 고해상도 위치 정보를 decoder에 전달하며 channel 수는 두 입력의 합이 된다.','pool/stride의 floor 연산 때문에 홀수 크기 입력은 upsampling 후 skip보다 1 pixel 다를 수 있다.','scale_factor=2만 믿기보다 skip.shape[-2:]를 target size로 명시하는 방법이 안정적이다.'],c:`import torch, torch.nn as nn, torch.nn.functional as F
class Up(nn.Module):
 def __init__(self,low,skip,out):
  super().__init__(); self.conv=nn.Conv2d(low+skip,out,3,padding=1)
 def forward(self,low,skip):
  up=F.interpolate(low,size=skip.shape[-2:],mode='bilinear',align_corners=False)
  return self.conv(torch.cat([up,skip],1))
print(Up(128,64,64)(torch.randn(2,128,31,31),torch.randn(2,64,63,63)).shape)`,p:['입력 255×255에서 pooling 3회 각 stage H,W를 기록한다.','scale_factor=2로 mismatch를 재현한다.','size=skip.shape[-2:] 방식으로 모든 stage assertion을 통과시킨다.','concat 대신 projection+addition skip을 구현해 memory 차이를 비교한다.'],q:[['skip concat 후 channel은?','두 입력 channel의 합'],['홀수 입력 mismatch 원인은?','pool/stride floor 연산'],['interpolate에 skip size를 직접 주는 장점은?','정확한 H,W 정렬']],r:[['U-Net paper','https://arxiv.org/abs/1505.04597'],['PyTorch interpolate','https://docs.pytorch.org/docs/stable/generated/torch.nn.functional.interpolate.html'],['PyTorch ConvTranspose2d','https://docs.pytorch.org/docs/stable/generated/torch.nn.ConvTranspose2d.html']]},
{d:'2026-09-13',n:11,t:'Runtime Instrumentation — forward hook, gradient, torch.profiler',s:'모델 수정 전후 activation·gradient·시간·메모리를 측정하는 최소 instrumentation toolkit을 만듭니다.',g:['forward hook으로 shape와 activation 통계를 수집한다.','gradient norm으로 역전파 흐름을 점검한다.','hook lifecycle을 안전하게 관리한다.','profiler로 CPU/GPU time과 memory hotspot을 찾는다.','A/B 비교에서 측정 조건을 고정한다.'],k:['forward hook은 module output 계산 후 호출되므로 shape, mean/std, NaN 비율을 수집하기 좋다. 단 functional op 전체를 보여주지는 않는다.','loss.backward 후 parameter.grad norm을 stage별로 기록하면 gradient가 사라지거나 폭발하는 위치를 찾는 데 도움이 된다.','profiler는 측정 자체 overhead가 있으므로 warm-up과 측정 iteration을 분리한다.','input shape, dtype, batch, device, autocast, warm-up 조건을 고정하지 않으면 구조 차이와 환경 차이를 혼동할 수 있다.'],c:`import torch, torch.nn as nn
stats={}; handles=[]
def hook(name):
 def f(m,inp,out):
  t=out.detach(); stats[name]=(tuple(t.shape),float(t.mean()),float(t.std()),float(torch.isnan(t).float().mean()))
 return f
model=nn.Sequential(nn.Conv2d(1,16,3,padding=1),nn.ReLU(),nn.Conv2d(16,32,3,2,1))
for name,m in model.named_modules():
 if isinstance(m,nn.Conv2d): handles.append(m.register_forward_hook(hook(name)))
y=model(torch.randn(4,1,256,256)); y.square().mean().backward()
for n,p in model.named_parameters():
 if p.grad is not None: print(n,p.grad.norm().item())
for h in handles:h.remove()
print(stats)`,p:['자신의 모델에 layer별 shape/mean/std/NaN collector를 붙인다.','stage별 grad norm 표를 만들고 이상 구간을 찾는다.','torch.profiler 상위 10개 op를 출력한다.','09/11 standard vs separable conv를 동일 조건에서 profiling한다.'],q:[['forward hook 호출 시점은?','module forward가 output을 계산한 뒤'],['handle.remove()를 하는 이유는?','중복 등록과 side effect 방지'],['benchmark에서 가장 먼저 고정할 것은?','input/device/dtype/batch 등 측정 조건']],r:[['PyTorch Module hooks','https://docs.pytorch.org/docs/stable/generated/torch.nn.Module.html'],['PyTorch profiler','https://docs.pytorch.org/tutorials/recipes/recipes/profiler_recipe.html']]}
];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let date=new URLSearchParams(location.search).get('date')||D[0].d;const tabs=document.querySelector('#tabs');D.forEach(x=>{let b=document.createElement('button');b.textContent=x.d.slice(5)+' · #'+x.n;b.onclick=()=>{date=x.d;history.replaceState(null,'','?date='+date);render()};tabs.append(b)});const list=(a,tag='ul')=>'<'+tag+'>'+a.map(v=>'<li>'+esc(v)+'</li>').join('')+'</'+tag+'>';function render(){let x=D.find(v=>v.d===date)||D[0];[...tabs.children].forEach((b,i)=>b.classList.toggle('on',D[i].d===x.d));document.querySelector('#lesson').innerHTML=`<div class="lesson-meta"><span class="pill">${x.d}</span><span class="pill">#${x.n}</span><span class="pill">30–40분</span></div><h2>${esc(x.t)}</h2><p class="box">${esc(x.s)}</p><section class="lesson-section"><h2>1. 학습 목표</h2>${list(x.g)}</section><section class="lesson-section"><h2>2. 핵심 이론</h2>${list(x.k)}</section><section class="lesson-section"><h2>3. 코드 추적</h2><pre class="code-block"><code>${esc(x.c)}</code></pre></section><section class="lesson-section"><h2>4. 직접 실습</h2>${list(x.p,'ol')}</section><section class="lesson-section"><h2>5. 복습 문제</h2>${x.q.map((q,i)=>`<details class="quiz"><summary>Q${i+1}. ${esc(q[0])}</summary><p><strong>정답:</strong> ${esc(q[1])}</p></details>`).join('')}</section><section class="lesson-section"><h2>6. 공식 참고자료</h2><ul>${x.r.map(r=>`<li><a href="${r[1]}" target="_blank" rel="noopener">${esc(r[0])} ↗</a></li>`).join('')}</ul></section>`}render();
</script></body></html>
