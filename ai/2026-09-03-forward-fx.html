<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="TorchVision ResNet BasicBlock의 main·identity 경로를 추적하고 runtime hook, torch.fx Node IR, ShapeProp, graph rewrite를 이용해 모델 실행 구조를 분석·수정한다."><title>AI 전문 개발 학습 #04 — PyTorch forward 추적과 torch.fx 그래프 해부</title><link rel="stylesheet" href="ai.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"></head><body><header class="topbar"><a class="brand" href="./"><span class="brand-mark">AI</span><span>AI 전문 개발 학습</span></a><a class="back" href="./">목록으로</a></header><main class="lesson-layout"><article class="lesson-main"><div class="lesson-meta"><span class="pill">2026.09.03</span><span class="pill">모델 아키텍처</span><span class="pill">Intermediate</span></div><h1 class="lesson-title">AI 전문 개발 학습 #04 — PyTorch forward 추적과 torch.fx 그래프 해부</h1><p class="lesson-summary">TorchVision ResNet BasicBlock의 main·identity 경로를 추적하고 runtime hook, torch.fx Node IR, ShapeProp, graph rewrite를 이용해 모델 실행 구조를 분석·수정한다.</p><div class="lesson-body" id="lesson-body"></div></article><aside class="toc"><strong>이 페이지에서</strong><nav id="toc-links"></nav></aside></main><footer><a href="./">← AI 학습 목록으로 돌아가기</a></footer><script type="application/json" id="lesson-source">"예상 학습 시간: **35\\~40분**  \n난이도: **Intermediate**  \n사용 기술: **PyTorch, torch.fx**\n지난 회차에서는 `nn.Module`의 등록 구조와 `state_dict`를 살펴봤습니다. 오늘은 한 단계 더 들어가서 **모델의 Python ****`forward()`****가 실제 연산 그래프로 어떻게 펼쳐지는지** 추적합니다.\n같은 모델도 세 가지 관점으로 볼 수 있습니다.\n1. `print(model)`: 등록된 module tree\n2. Runtime hook: 특정 입력에서 실제 실행된 module과 Tensor shape\n3. `torch.fx`: module 호출뿐 아니라 덧셈, 함수 호출, Tensor method까지 포함한 편집 가능한 그래프\n## 1. 학습 목표\n오늘 학습을 마치면 다음을 할 수 있어야 합니다.\n- TorchVision ResNet `BasicBlock`의 forward를 줄 단위로 추적한다.\n- residual main path와 identity path의 shape 조건을 설명한다.\n- module tree, runtime execution trace, FX graph의 차이를 구분한다.\n- `torch.fx.symbolic_trace()`가 `Proxy`를 이용해 그래프를 만드는 원리를 이해한다.\n- FX node의 `op`, `target`, `args`, `kwargs`, `users`를 읽는다.\n- `ShapeProp`으로 각 node의 Tensor shape와 dtype을 주석 처리한다.\n- FX graph에서 `F.relu`를 `F.silu`로 교체하고 수정된 코드를 재생성한다.\n- data-dependent control flow가 symbolic tracing에 실패하는 이유를 진단한다.\n## 2. 핵심 이론\n### 2.1 Module tree는 실행 그래프가 아니다\n다음 모델을 출력하면 convolution과 BatchNorm 같은 등록된 submodule을 볼 수 있습니다.\n```python\nprint(model)\n```\n그러나 module tree에는 다음 연산이 보이지 않을 수 있습니다.\n- `out + identity` 같은 Tensor 덧셈\n- `torch.flatten(x, 1)`\n- `F.relu(x)`와 같은 functional API\n- indexing, reshape, transpose 같은 Tensor method\n- `if`, `for`에 의해 결정되는 실행 순서\n즉, `print(model)`은 **어떤 부품이 등록됐는지** 보여주지만 **부품이 어떤 순서와 연결로 실행되는지** 완전히 보여주지는 않습니다.\n### 2.2 TorchVision `BasicBlock` 해부\nTorchVision ResNet의 `BasicBlock` forward는 개념적으로 다음 구조입니다.\n```python\ndef forward(self, x):\n    identity = x\n\n    out = self.conv1(x)\n    out = self.bn1(out)\n    out = self.relu(out)\n\n    out = self.conv2(out)\n    out = self.bn2(out)\n\n    if self.downsample is not None:\n        identity = self.downsample(x)\n\n    out += identity\n    out = self.relu(out)\n\n    return out\n```\n줄 단위로 해석하면 다음과 같습니다.\n#### `identity = x`\n입력 Tensor 객체의 별도 복사본을 만드는 것이 아닙니다. 같은 Tensor를 가리키는 reference를 저장합니다. 이후 `identity`는 skip connection을 통해 main path의 출력에 더해집니다.\n#### `conv1 → bn1 → relu`\n첫 번째 convolution은 feature를 변환하며, block이 downsampling을 담당하는 경우 `stride=2`가 적용될 수 있습니다. BatchNorm은 channel별 분포를 정규화하고 ReLU가 비선형성을 추가합니다.\n#### `conv2 → bn2`\n두 번째 convolution 뒤에는 덧셈 전에 activation을 적용하지 않습니다. main path와 identity path를 먼저 합친 뒤 ReLU를 적용합니다. 이것이 전형적인 post-activation ResNet V1 block입니다.\n#### `downsample(x)`\n다음 중 하나라도 성립하면 identity를 그대로 더할 수 없습니다.\n- spatial size가 다름\n- channel 수가 다름\n예를 들어 main path가 `[N, 16, 64, 64]`에서 `[N, 32, 32, 32]`로 변하면 identity도 일반적으로 `1×1 Conv, stride=2`와 normalization을 거쳐 `[N, 32, 32, 32]`가 되어야 합니다.\n#### `out += identity`\n두 Tensor는 각 차원이 동일하거나 broadcasting 가능한 상태여야 합니다. Residual block에서는 의도하지 않은 broadcasting보다 **완전히 같은 shape**를 요구하는 것이 안전합니다.\nTorchVision의 실제 구현에서도 stride가 1이 아니거나 입력 channel과 출력 channel이 다르면 projection downsample을 구성합니다.\n### 2.3 Runtime hook의 역할\nForward hook은 실제 Tensor 입력으로 모델을 실행하면서 등록된 module의 입력과 출력을 관찰합니다.\n장점:\n- 실제 batch·image size에서 정확한 shape 확인\n- 조건문으로 선택된 실제 경로 확인\n- min, max, mean, NaN 비율 같은 값 기반 통계 확인\n- tracing을 지원하지 않는 Python·custom operator에도 사용 가능\n한계:\n- `F.relu`, `operator.add`, `.flatten()`처럼 module이 아닌 연산은 일반 module hook으로 보이지 않음\n- 한 번 실행된 경로만 관찰함\n- 그래프를 직접 편집하는 IR이 아님\n- hook 등록과 제거 lifecycle을 직접 관리해야 함\n### 2.4 `torch.fx`의 mental model\n`torch.fx`는 `nn.Module`을 분석하고 변환하기 위한 toolkit입니다. 대표적인 흐름은 다음 세 단계입니다.\n1. **Symbolic tracing**: Python forward를 실행하되 실제 Tensor 대신 `Proxy`를 사용해 연산 기록\n2. **Intermediate representation**: 연산을 `Graph`와 `Node` 객체로 표현\n3. **GraphModule 생성**: 수정된 graph에서 다시 실행 가능한 Python 코드를 생성\n```python\nfrom torch.fx import symbolic_trace\n\ngraph_module = symbolic_trace(model)\n```\nTracer가 forward에 `Proxy`를 전달하면 다음 연산은 실제 계산 결과 대신 새 graph node를 만듭니다.\n```python\ny = self.conv(x)\nz = y + x\nz = z.flatten(1)\n```\n결과적으로 `call_module`, `call_function`, `call_method` node가 만들어집니다.\n중요한 점은 FX graph가 일반적으로 CUDA kernel이나 ATen operator 수준까지 완전히 낮아진 그래프는 아니라는 것입니다. Python 프로그램의 module·function·method 호출을 비교적 높은 수준에서 표현합니다.\n### 2.5 FX Node의 다섯 가지 핵심 op\n각 node에는 `op`, `target`, `args`, `kwargs`, `users`가 있습니다.\n#### `placeholder`\nforward의 입력입니다.\n```plain text\nplaceholder  x\n```\n#### `get_attr`\nmodule에 저장된 parameter, buffer 또는 constant attribute를 가져옵니다.\n```plain text\nget_attr  scale\n```\n#### `call_module`\n등록된 submodule을 호출합니다. `target`은 module 경로입니다.\n```plain text\ncall_module  stem.0\ncall_module  layer1.conv1\n```\n#### `call_function`\nPython 또는 PyTorch function을 호출합니다.\n```plain text\ncall_function  operator.add\ncall_function  torch.nn.functional.relu\n```\n#### `call_method`\nTensor method를 호출합니다.\n```plain text\ncall_method  flatten\ncall_method  permute\n```\n마지막 `output` node는 graph의 반환값을 나타냅니다.\n### 2.6 `args`, `kwargs`, `users`\n`node.args`에는 positional input이 들어갑니다. 이 값은 다른 `Node`, 상수 또는 중첩된 tuple/list/dict가 될 수 있습니다.\n```python\nfor node in graph_module.graph.nodes:\n    print(node.name)\n    print(\"  op:\", node.op)\n    print(\"  target:\", node.target)\n    print(\"  args:\", node.args)\n    print(\"  kwargs:\", node.kwargs)\n    print(\"  users:\", list(node.users))\n```\n`users`는 해당 node의 출력을 소비하는 downstream node를 보여줍니다. Graph rewrite에서 특정 node를 제거하기 전에 누가 그 출력을 사용하는지 확인할 수 있습니다.\n### 2.7 Symbolic tracing과 control flow\n다음처럼 module 설정값에 의해 결정되는 branch는 trace 시점에 한쪽 경로가 고정될 수 있습니다.\n```python\nif self.use_projection:\n    x = self.projection(x)\n```\n반면 Tensor 값에 의해 결정되는 branch는 일반적인 symbolic trace가 판단할 수 없습니다.\n```python\nif x.mean() > 0:\n    return self.positive_path(x)\nelse:\n    return self.negative_path(x)\n```\n`x.mean() > 0`의 결과도 Proxy이므로 Python이 이를 `True` 또는 `False`로 바꿀 수 없습니다. 실제 데이터에 따라 매번 다른 graph가 필요하기 때문입니다.\n## 3. 실제 모델과 코드 구조 분석\n초음파 grayscale 입력을 위한 작은 residual classifier를 사용합니다.\n```python\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\n\n\nclass BasicBlock(nn.Module):\n    def __init__(self, in_channels, out_channels, stride=1):\n        super().__init__()\n\n        self.conv1 = nn.Conv2d(\n            in_channels,\n            out_channels,\n            kernel_size=3,\n            stride=stride,\n            padding=1,\n            bias=False,\n        )\n        self.bn1 = nn.BatchNorm2d(out_channels)\n\n        self.conv2 = nn.Conv2d(\n            out_channels,\n            out_channels,\n            kernel_size=3,\n            stride=1,\n            padding=1,\n            bias=False,\n        )\n        self.bn2 = nn.BatchNorm2d(out_channels)\n\n        if stride != 1 or in_channels != out_channels:\n            self.projection = nn.Sequential(\n                nn.Conv2d(\n                    in_channels,\n                    out_channels,\n                    kernel_size=1,\n                    stride=stride,\n                    bias=False,\n                ),\n                nn.BatchNorm2d(out_channels),\n            )\n        else:\n            self.projection = nn.Identity()\n\n    def forward(self, x):\n        identity = self.projection(x)\n\n        out = self.conv1(x)\n        out = self.bn1(out)\n        out = F.relu(out)\n\n        out = self.conv2(out)\n        out = self.bn2(out)\n\n        out = out + identity\n        return F.relu(out)\n\n\nclass UltrasoundResidualNet(nn.Module):\n    def __init__(self, num_classes=2):\n        super().__init__()\n\n        self.stem = nn.Sequential(\n            nn.Conv2d(\n                1,\n                16,\n                kernel_size=3,\n                stride=2,\n                padding=1,\n                bias=False,\n            ),\n            nn.BatchNorm2d(16),\n            nn.ReLU(inplace=False),\n        )\n\n        self.layer1 = BasicBlock(16, 16, stride=1)\n        self.layer2 = BasicBlock(16, 32, stride=2)\n        self.pool = nn.AdaptiveAvgPool2d(1)\n        self.head = nn.Linear(32, num_classes)\n\n    def forward(self, x):\n        x = self.stem(x)\n        x = self.layer1(x)\n        x = self.layer2(x)\n        x = self.pool(x)\n        x = x.flatten(1)\n        return self.head(x)\n```\n입력이 `[2, 1, 128, 128]`일 때 예상 shape은 다음과 같습니다.\n```plain text\ninput              [2,  1, 128, 128]\nstem               [2, 16,  64,  64]\nlayer1 main        [2, 16,  64,  64]\nlayer1 identity    [2, 16,  64,  64]\nlayer1 output      [2, 16,  64,  64]\nlayer2 main        [2, 32,  32,  32]\nlayer2 projection  [2, 32,  32,  32]\nlayer2 output      [2, 32,  32,  32]\npool               [2, 32,   1,   1]\nflatten            [2, 32]\nhead               [2, 2]\n```\n`layer1.projection`은 `Identity`이므로 값과 shape를 그대로 전달합니다. `layer2.projection`은 channel을 16에서 32로 바꾸고 spatial size를 절반으로 줄입니다.\n## 4. 수정 가능한 지점과 설계 trade-off\n### 4.1 Hook과 FX 중 무엇을 선택할까?\n<table header-row=\"true\">\n<tr>\n<td>목적</td>\n<td>Runtime hook</td>\n<td>`torch.fx`</td>\n</tr>\n<tr>\n<td>실제 Tensor shape와 값 확인</td>\n<td>매우 적합</td>\n<td>`ShapeProp` 또는 실행 필요</td>\n</tr>\n<tr>\n<td>data-dependent branch 관찰</td>\n<td>실행된 경로만 가능</td>\n<td>기본 symbolic trace는 제한적</td>\n</tr>\n<tr>\n<td>functional operation 확인</td>\n<td>제한적</td>\n<td>가능</td>\n</tr>\n<tr>\n<td>graph 자동 수정</td>\n<td>부적합</td>\n<td>적합</td>\n</tr>\n<tr>\n<td>custom CUDA op 포함 모델</td>\n<td>실행 가능하면 관찰 가능</td>\n<td>tracer 설정이 필요할 수 있음</td>\n</tr>\n<tr>\n<td>운영 중 간단한 진단</td>\n<td>가능</td>\n<td>graph 생성 비용과 호환성 검토 필요</td>\n</tr>\n</table>\n실무에서는 둘 중 하나만 고르기보다 다음 순서가 유용합니다.\n1. Module tree로 구조 확인\n2. Hook으로 실제 shape·값 검증\n3. FX로 연산 연결과 변환 지점 확인\n### 4.2 Functional activation과 module activation\n```python\nx = F.relu(x)\n```\nFX에서는 일반적으로 `call_function` node로 나타납니다.\n```python\nself.relu = nn.ReLU()\nx = self.relu(x)\n```\nFX에서는 `call_module`로 나타납니다.\nModule 방식은 activation을 이름으로 찾거나 교체하기 쉽고 module hook도 사용할 수 있습니다. Functional 방식은 코드가 간결하지만 module tree와 일반 hook에서 보이지 않습니다. FX를 사용하면 functional operation도 찾을 수 있습니다.\n### 4.3 In-place operation\nTorchVision `BasicBlock`은 `out += identity`와 `ReLU(inplace=True)`를 사용합니다. 메모리를 일부 절약할 수 있지만 다음 상황에서는 분석과 변경을 복잡하게 할 수 있습니다.\n- 중간 activation을 다른 branch에서도 사용\n- custom backward 구현\n- graph rewrite 후 alias 관계 변경\n- activation을 시각화하거나 여러 loss에서 재사용\n분석·연구 단계에서는 우선 `out = out + identity`, `inplace=False`로 명확성을 확보한 뒤 성능을 측정해 in-place 최적화를 검토하는 것이 안전합니다.\n### 4.4 ReLU를 SiLU로 교체\nSiLU는 음수 영역에서도 완전히 0이 아닌 gradient를 제공하고 부드러운 함수입니다. 초음파의 약한 echo feature를 처리할 때 성능 차이를 실험할 가치가 있습니다.\nTrade-off:\n- ReLU: 단순하고 빠르며 양자화·배포 친화적\n- SiLU: 부드러운 gradient, 일부 모델에서 정확도 개선 가능\n- SiLU는 backend와 정밀도에 따라 latency가 증가할 수 있음\n- pretrained ReLU 모델의 activation을 바꾸면 feature 분포가 달라지므로 추가 학습 필요\n### 4.5 FX GraphModule과 checkpoint\n단순히 functional activation만 교체하면 parameter shape는 변하지 않습니다. 그러나 submodule을 추가·삭제하거나 이름을 바꾸는 transformation은 `state_dict` key 호환성을 바꿀 수 있습니다.\n변환 전후에 다음을 비교해야 합니다.\n```python\nbefore = set(model.state_dict())\nafter = set(graph_module.state_dict())\n\nprint(\"missing:\", before - after)\nprint(\"added:\", after - before)\n```\n## 5. 직접 실행 실습\n### 실습 A: Runtime hook으로 실제 실행 순서 확인\n```python\nimport torch\nimport torch.nn as nn\n\n\nmodel = UltrasoundResidualNet().eval()\nrecords = []\nhandles = []\n\n\ndef make_hook(name):\n    def hook(module, inputs, output):\n        records.append({\n            \"name\": name,\n            \"type\": type(module).__name__,\n            \"input\": tuple(inputs[0].shape),\n            \"output\": tuple(output.shape),\n        })\n    return hook\n\n\ntry:\n    for name, module in model.named_modules():\n        if name and len(list(module.children())) == 0:\n            handles.append(\n                module.register_forward_hook(make_hook(name))\n            )\n\n    with torch.no_grad():\n        logits = model(torch.randn(2, 1, 128, 128))\n\nfinally:\n    for handle in handles:\n        handle.remove()\n\n\nfor row in records:\n    print(\n        f\"{row['name']:24s} \"\n        f\"{row['type']:18s} \"\n        f\"{row['input']} -> {row['output']}\"\n    )\n\nprint(\"logits:\", tuple(logits.shape))\n```\n확인할 내용:\n- `layer1.projection`의 `Identity`도 실행 기록에 나타납니다.\n- `layer2.projection.0`의 입력은 `[2, 16, 64, 64]`, 출력은 `[2, 32, 32, 32]`입니다.\n- `out + identity`, `F.relu`, `flatten`은 module hook에 나타나지 않습니다.\n### 실습 B: FX graph와 생성된 Python 코드 읽기\n```python\nfrom torch.fx import symbolic_trace\n\n\nmodel = UltrasoundResidualNet().eval()\ntraced = symbolic_trace(model)\n\nprint(\"[Graph]\")\nprint(traced.graph)\n\nprint(\"\\n[Generated Python]\")\nprint(traced.code)\n\nprint(\"\\n[Node details]\")\nfor node in traced.graph.nodes:\n    print(\n        f\"{node.name:24s} \"\n        f\"op={node.op:14s} \"\n        f\"target={node.target}\"\n    )\n```\n관찰 포인트:\n- `stem.0`, convolution, BatchNorm, projection은 `call_module`\n- `F.relu`는 `call_function`\n- residual 덧셈도 `call_function`\n- `flatten`은 `call_method`\n- 사용자 정의 `BasicBlock` 내부 연산은 graph에 펼쳐짐\n- `Conv2d`, `BatchNorm2d` 같은 표준 module 내부 계산은 기본적으로 하나의 leaf `call_module`로 유지됨\n### 실습 C: `ShapeProp`으로 node별 shape 추가\nSymbolic trace 자체는 실제 Tensor shape를 반드시 계산하지 않습니다. 예제 입력으로 graph를 실행하며 metadata를 채우겠습니다.\n```python\nimport torch\nfrom torch.fx.passes.shape_prop import ShapeProp\n\n\nsample = torch.randn(2, 1, 128, 128)\nShapeProp(traced).propagate(sample)\n\n\nfor node in traced.graph.nodes:\n    tensor_meta = node.meta.get(\"tensor_meta\")\n\n    if tensor_meta is None:\n        shape = \"-\"\n        dtype = \"-\"\n    else:\n        shape = tuple(tensor_meta.shape)\n        dtype = tensor_meta.dtype\n\n    print(\n        f\"{node.name:24s} \"\n        f\"{str(shape):24s} \"\n        f\"{dtype}\"\n    )\n```\n`ShapeProp`은 graph를 실제로 실행합니다. 따라서 다음을 주의해야 합니다.\n- 모델과 sample이 같은 device에 있어야 함\n- parameter와 입력 dtype이 호환돼야 함\n- BatchNorm running statistics를 바꾸지 않도록 분석 시 `eval()` 권장\n- 매우 큰 입력은 실제 메모리를 사용하므로 작은 대표 입력 사용\n### 실습 D: FX graph에서 `F.relu`를 `F.silu`로 교체\n```python\nimport torch\nimport torch.nn.functional as F\nfrom torch.fx import symbolic_trace\n\n\nmodel = UltrasoundResidualNet().eval()\ntraced = symbolic_trace(model)\n\nsample = torch.randn(2, 1, 128, 128)\n\nwith torch.no_grad():\n    original_output = traced(sample)\n\n\nreplaced = 0\n\nfor node in list(traced.graph.nodes):\n    if node.op == \"call_function\" and node.target is F.relu:\n        with traced.graph.inserting_after(node):\n            new_node = traced.graph.call_function(\n                F.silu,\n                args=node.args,\n                kwargs={},\n            )\n\n        node.replace_all_uses_with(new_node)\n        traced.graph.erase_node(node)\n        replaced += 1\n\n\ntraced.graph.lint()\ntraced.recompile()\n\nwith torch.no_grad():\n    modified_output = traced(sample)\n\n\nprint(\"replaced nodes:\", replaced)\nprint(\"original shape:\", tuple(original_output.shape))\nprint(\"modified shape:\", tuple(modified_output.shape))\nprint(\n    \"max abs difference:\",\n    (original_output - modified_output).abs().max().item()\n)\n\nprint(\"\\n[Modified Python]\")\nprint(traced.code)\n```\n예상 결과:\n- 두 BasicBlock의 ReLU가 각각 두 번씩 있으므로 functional ReLU 4개가 교체됩니다.\n- `stem`의 `nn.ReLU`는 `call_module`이므로 이 코드에서는 교체되지 않습니다.\n- 출력 shape는 모두 `[2, 2]`입니다.\n- activation이 달라졌으므로 출력 값의 차이는 0이 아닙니다.\nGraph 수정 후에는 다음 두 호출이 중요합니다.\n```python\ntraced.graph.lint()\ntraced.recompile()\n```\n`lint()`는 node 순서, ownership, 존재하지 않는 target 같은 graph 불일치를 검사합니다. `recompile()`은 변경된 graph로 실행할 Python forward 코드를 다시 생성합니다.\n### 실습 E: Data-dependent control flow 실패 재현\n```python\nimport torch\nimport torch.nn as nn\nfrom torch.fx import symbolic_trace\n\n\nclass DynamicBranch(nn.Module):\n    def __init__(self):\n        super().__init__()\n        self.positive = nn.Conv2d(1, 1, 3, padding=1)\n        self.negative = nn.Conv2d(1, 1, 1)\n\n    def forward(self, x):\n        if x.mean() > 0:\n            return self.positive(x)\n        return self.negative(x)\n\n\ntry:\n    symbolic_trace(DynamicBranch())\nexcept Exception as error:\n    print(type(error).__name__)\n    print(error)\n```\nTracer는 `x.mean() > 0`을 실제 Boolean으로 결정할 수 없으므로 control-flow 관련 오류가 발생합니다.\n대응 방법:\n- branch를 Tensor 연산인 `torch.where` 또는 mask 조합으로 표현\n- branch 조건을 input data가 아닌 고정된 module configuration으로 변경\n- custom `Tracer`에서 특정 영역을 leaf module로 처리\n- symbolic trace보다 동적 제어 흐름 지원 범위가 넓은 `torch.export` 검토\n- 목적이 관찰이라면 runtime hook이나 profiler 사용\n## 6. 예상 결과와 디버깅 포인트\n<table header-row=\"true\">\n<tr>\n<td>증상</td>\n<td>원인 후보</td>\n<td>확인 및 대응</td>\n</tr>\n<tr>\n<td>FX graph에 residual add가 안 보인다고 생각함</td>\n<td>target 표시를 놓침</td>\n<td>`call_function` node와 `operator.add` 확인</td>\n</tr>\n<tr>\n<td>Hook에는 ReLU가 일부만 나타남</td>\n<td>`F.relu`는 module이 아님</td>\n<td>FX의 `call_function` 확인</td>\n</tr>\n<tr>\n<td>Custom block이 한 node로만 보임</td>\n<td>tracer가 leaf로 취급</td>\n<td>custom Tracer의 `is_leaf_module` 확인</td>\n</tr>\n<tr>\n<td>Trace 중 Boolean 관련 오류</td>\n<td>data-dependent branch</td>\n<td>Tensor 연산으로 변경하거나 다른 capture 방식 사용</td>\n</tr>\n<tr>\n<td>ShapeProp에서 device 오류</td>\n<td>model과 sample device 불일치</td>\n<td>동일 device로 이동</td>\n</tr>\n<tr>\n<td>ShapeProp 후 BN 값이 변함</td>\n<td>train mode에서 실행</td>\n<td>분석 전 `model.eval()` 호출</td>\n</tr>\n<tr>\n<td>Graph를 수정했지만 실행 결과가 그대로임</td>\n<td>`recompile()` 누락</td>\n<td>`lint()` 후 `recompile()`</td>\n</tr>\n<tr>\n<td>Node 삭제 시 오류</td>\n<td>아직 사용자가 존재</td>\n<td>`node.users` 확인 후 use 교체</td>\n</tr>\n<tr>\n<td>변환 후 checkpoint key가 바뀜</td>\n<td>module 추가·삭제·이름 변경</td>\n<td>변환 전후 `state_dict` key 비교</td>\n</tr>\n<tr>\n<td>In-place 관련 backward 오류</td>\n<td>alias된 Tensor 수정</td>\n<td>out-of-place 연산으로 바꾸고 재검증</td>\n</tr>\n</table>\n### 실무용 추적 순서\n1. `model.eval()`로 분석 상태를 고정합니다.\n2. 작은 대표 입력의 shape, dtype, device를 정합니다.\n3. module tree와 `state_dict` key를 저장합니다.\n4. runtime hook으로 실제 shape를 수집합니다.\n5. FX graph의 node type과 연결을 확인합니다.\n6. `ShapeProp`으로 graph node에 shape를 붙입니다.\n7. 수정은 한 종류의 node부터 시작합니다.\n8. `lint()`와 `recompile()`을 호출합니다.\n9. 동일 입력으로 원본과 수정본의 shape·수치 차이를 비교합니다.\n10. forward뿐 아니라 backward와 checkpoint reload도 검증합니다.\n### 테스트 기준\nActivation 교체처럼 의도적으로 수치를 바꾸는 변환에서는 `torch.allclose()`가 성공할 필요가 없습니다. 대신 다음을 확인합니다.\n- 출력 shape와 dtype 유지\n- 모든 값이 finite\n- gradient가 필요한 parameter까지 전달\n- state key 변경 여부가 예상과 일치\n- latency와 memory 변화 측정\n- 실제 validation metric 재평가\n```python\nassert original_output.shape == modified_output.shape\nassert torch.isfinite(modified_output).all()\n```\n## 7. 복습 문제\n1. `print(model)`에는 residual 덧셈이나 `F.relu`가 나타나지 않는 이유는 무엇인가요?\n2. Runtime hook과 FX graph의 가장 중요한 차이를 한 가지씩 설명하세요.\n3. FX node에서 `call_module`, `call_function`, `call_method`는 각각 무엇을 의미하나요?\n4. `x.mean() > 0`에 따라 Python `if` branch를 선택하는 모델이 `symbolic_trace()`에서 실패하는 이유는 무엇인가요?\n5. FX graph에서 node를 교체한 뒤 호출해야 하는 두 메서드와 각각의 목적은 무엇인가요?\n### 정답과 해설\n1. `print(model)`은 등록된 submodule tree를 보여줍니다. residual 덧셈은 Tensor 연산이고 `F.relu`는 functional API이므로 submodule로 등록되지 않습니다. 실행 연결을 보려면 FX graph나 다른 graph capture 방식이 필요합니다.\n2. Runtime hook은 실제 Tensor로 실행된 module의 shape와 값을 관찰하지만 편집 가능한 전체 연산 graph를 만들지는 않습니다. FX는 Proxy로 연산 연결을 기록해 편집 가능한 `GraphModule`을 만들지만 data-dependent Python control flow에는 제한이 있습니다.\n3. `call_module`은 등록된 submodule 호출, `call_function`은 Python/PyTorch 함수 호출, `call_method`는 Tensor와 같은 객체의 method 호출을 의미합니다. `target`을 함께 읽어 실제 대상이 convolution인지, `operator.add`인지, `flatten`인지 확인해야 합니다.\n4. 조건식의 결과도 실제 Boolean이 아니라 Proxy입니다. Python `if`는 즉시 `True` 또는 `False`를 요구하지만 tracer는 실제 입력 값이 없으므로 어느 branch를 기록할지 결정할 수 없습니다.\n5. `graph.lint()`는 graph의 구조적 일관성을 검사합니다. `GraphModule.recompile()`은 변경된 graph로 실행할 Python 코드를 다시 생성합니다. 둘을 생략하면 잘못된 graph가 남거나 수정이 실제 forward에 반영되지 않을 수 있습니다.\n## 8. 다음 학습 예고\n다음 회차는 **Residual block 직접 수정: dilation, stride, projection과 receptive field**입니다.\n- kernel, stride, padding, dilation의 조합\n- output shape를 유지하면서 receptive field를 확대하는 방법\n- downsampling을 dilation으로 교체할 때의 연산량·메모리 변화\n- pretrained weight를 유지할 수 있는 변경과 유지할 수 없는 변경\n- 초음파의 작은 병변과 넓은 문맥을 함께 보는 multi-scale block\n- 원본 block과 수정 block의 parameter 수·출력 shape·gradient 비교\n## 참고 자료\n- [PyTorch ](https://docs.pytorch.org/docs/stable/fx.html)[`torch.fx`](https://docs.pytorch.org/docs/stable/fx.html)[ 문서](https://docs.pytorch.org/docs/stable/fx.html)\n- [TorchVision ResNet 실제 구현](https://docs.pytorch.org/vision/stable/_modules/torchvision/models/resnet.html)\n- [PyTorch ](https://docs.pytorch.org/docs/stable/user_guide/torch_compiler/export.html)[`torch.export`](https://docs.pytorch.org/docs/stable/user_guide/torch_compiler/export.html)[ 문서](https://docs.pytorch.org/docs/stable/user_guide/torch_compiler/export.html)"</script><script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script defer src="lesson.js"></script></body></html>
