<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily English · 2026.09.07–09.13</title><style>body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8fa;color:#111827}header{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 5%;display:flex;justify-content:space-between}main{max-width:980px;margin:auto;padding:28px 18px 70px}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tabs button,.copy{border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer;white-space:nowrap}.tabs button.on,.copy{background:#111827;color:#fff}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:14px 0}.grammar-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.mini{border:1px solid #e5e7eb;border-radius:12px;padding:14px}.reading p{line-height:1.75}.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.vocab div{border:1px solid #e5e7eb;border-radius:12px;padding:12px}.quiz{border-top:1px solid #e5e7eb;padding:10px 0}.choices{display:grid;gap:7px;margin-top:8px}.choices button{padding:9px;text-align:left;border:1px solid #d1d5db;border-radius:9px;background:#fff}.choices button.ok{background:#ecfdf5}.choices button.bad{background:#fef2f2}.note{color:#6b7280;font-size:14px}.idiom{margin:8px 0}.voice{background:#eef2ff}.status{font-size:13px;margin-left:10px;color:#4b5563}details summary{cursor:pointer}h1{font-size:30px;line-height:1.25}h2{font-size:22px}a{color:inherit}</style></head><body><header><strong>Daily English · B2</strong><nav><a href="./">전체 자료</a> · <a href="../">학습 허브</a></nav></header><main><p class="note">WEEKLY WORKBOOK · 2026.09.07–09.13</p><h1>문법 → 이디엄 → 읽기 → 어휘 → 퀴즈 → Voice 리뷰</h1><p>날짜를 선택하면 해당 수업 전체가 열립니다. 한국어 번역은 기본적으로 접혀 있습니다.</p><div id="tabs" class="tabs"></div><div id="lesson"><p>학습 자료를 불러오는 중...</p></div></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let DATA=[],date=new URLSearchParams(location.search).get('date')||'2026-09-07';const tabs=document.querySelector('#tabs'),root=document.querySelector('#lesson');const list=a=>'<ul>'+a.map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul>';
function voicePrompt(x){return `You are my B2 English speaking coach. I already completed this Daily English lesson by myself on mobile. Conduct a focused 12–15 minute Voice review. Ask exactly one question at a time and wait until I finish. After every answer give brief feedback in this order: meaning → grammar → a more natural expression → one pronunciation point. Ask me to repeat the corrected sentence. Review through speaking: warm-up, grammar use, idioms, reading comprehension and pronunciation. If you cannot judge pronunciation reliably, say so. End with three key corrections and two review items.\n\nDATE: ${x.date}\nGRAMMAR: ${x.grammarTopic}\nREADING: ${x.readingTitle}\n\nREADING PASSAGE:\n${x.paragraphs.join('\n\n')}\n\nIDIOMS:\n${x.idioms.map(i=>i.term+' — '+i.meaning+' — '+i.example).join('\n')}`}
function render(){const x=DATA.find(v=>v.date===date)||DATA[0];if(!x)return;date=x.date;[...tabs.children].forEach((b,i)=>b.classList.toggle('on',DATA[i].date===x.date));history.replaceState(null,'','?date='+date);const grammar=x.grammar.points.map((p,i)=>`<div class="mini"><strong>${i+1}. ${esc(p.title)}</strong><p>${esc(p.explanation)}</p>${list(p.examples)}</div>`).join('');const idioms=x.idioms.map(i=>`<div class="idiom"><strong>${esc(i.term)}</strong> — ${esc(i.meaning)}<br><span class="note">${esc(i.example)}</span></div>`).join('');const paragraphs=x.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('');const trans=x.translations.map(p=>`<p>${esc(p)}</p>`).join('');const vocab=x.vocabulary.map(v=>`<div><strong>${esc(v.term)}</strong> <span class="note">${esc(v.partOfSpeech)}</span><br>${esc(v.meaning)}<p class="note">${esc(v.context)}</p></div>`).join('');const quiz=x.quiz.map((q,qi)=>`<div class="quiz"><strong>Q${qi+1}. ${esc(q.question)}</strong><div class="choices">${q.choices.map((c,ci)=>`<button data-q="${qi}" data-c="${ci}">${String.fromCharCode(65+ci)}. ${esc(c)}</button>`).join('')}</div><p id="a${qi}" class="note"></p></div>`).join('');root.innerHTML=`<section class="card"><p class="note">${x.date}</p><h2>${esc(x.readingTitle)}</h2><strong>Grammar · ${esc(x.grammarTopic)}</strong></section><section class="card"><h2>1. Grammar</h2><p>${esc(x.grammar.summary)}</p><div class="grammar-grid">${grammar}</div></section><section class="card"><h2>2. Idioms</h2>${idioms}</section><section class="card reading"><h2>3. Reading</h2>${paragraphs}<details><summary>한국어 번역 보기</summary>${trans}</details></section><section class="card"><h2>4. Vocabulary</h2><div class="vocab">${vocab}</div></section><section class="card"><h2>5. Quiz · 10 questions</h2>${quiz}</section><section class="card voice"><h2>6. Advanced Voice Review</h2><p>모바일 자율 학습 후 PC Voice에서 12–15분 리뷰할 수 있도록 당일 자료를 포함한 프롬프트를 복사합니다.</p><button class="copy" id="copy">Voice 프롬프트 복사</button><span id="status" class="status"></span></section>`;document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const qi=+b.dataset.q,ci=+b.dataset.c,q=x.quiz[qi];document.querySelectorAll(`[data-q="${qi}"]`).forEach(z=>{z.disabled=true;z.classList.add(+z.dataset.c===q.answer?'ok':(+z.dataset.c===ci?'bad':''))});document.querySelector('#a'+qi).textContent=(ci===q.answer?'정답. ':'정답: '+String.fromCharCode(65+q.answer)+'. ')+q.explanation});document.querySelector('#copy').onclick=async()=>{const p=voicePrompt(x);try{await navigator.clipboard.writeText(p);document.querySelector('#status').textContent='복사 완료'}catch{document.querySelector('#status').textContent='브라우저 권한 때문에 복사할 수 없습니다.'}}}
Promise.all([fetch('week-2026-09-07/2026-09-07.json').then(r=>r.json()),fetch('week-2026-09-07/2026-09-08.json').then(r=>r.json()),fetch('week-2026-09-07/rest.json').then(r=>r.json())]).then(([a,b,rest])=>{DATA=[a,b,...rest].sort((x,y)=>x.date.localeCompare(y.date));DATA.forEach(x=>{let btn=document.createElement('button');btn.textContent=x.date.slice(5);btn.onclick=()=>{date=x.date;render()};tabs.append(btn)});render()}).catch(e=>{root.innerHTML='<section class="card"><h2>학습 자료를 불러오지 못했습니다.</h2><p>'+esc(e.message)+'</p></section>'});
</script></body></html>
