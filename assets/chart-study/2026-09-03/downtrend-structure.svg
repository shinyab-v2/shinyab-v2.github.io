<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">유선형 하락 차트 이해하기</title>
<desc id="desc">Lower High와 Lower Low가 반복되는 하락 추세에서 이동평균선 저항, 추세선 반등 실패, 지지선 이탈과 거래량 변화를 설명하는 교육용 합성 차트</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef3f9"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/></filter>
  <style><![CDATA[
    .t{font-family:Inter,'Noto Sans KR','Apple SD Gothic Neo',Arial,sans-serif;fill:#0f172a}
    .muted{fill:#64748b}.small{font-size:20px}.label{font-size:23px;font-weight:800}.axis{font-size:18px;fill:#64748b}.note{font-size:22px;font-weight:800}
  ]]></style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="35" y="35" width="1530" height="830" rx="28" fill="#fff" filter="url(#shadow)"/>
